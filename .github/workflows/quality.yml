name: Offline quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python 3.12 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned runtime and quality dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          python -m pip check

      - name: Compile application and tests
        run: python -m compileall -q src tests

      - name: Ruff critical architecture
        run: >-
          python -m ruff check
          src/dztgbot/domain
          src/dztgbot/services
          src/dztgbot/infrastructure
          src/dztgbot/ui
          src/dztgbot/__main__.py

      - name: Strict type check for the new architecture
        run: python -m mypy

      - name: Offline unit suite with branch measurement
        run: python -m coverage run -m unittest discover -s tests -v

      - name: FSM, callback, and security branch gate (90%)
        run: >-
          python -m coverage report --fail-under=90
          --include='src/dztgbot/domain/fsm.py,src/dztgbot/domain/callbacks.py,src/dztgbot/domain/policy.py,src/dztgbot/services/callback_service.py'

      - name: Repository and submission branch gate (75%)
        run: >-
          python -m coverage report --fail-under=75
          --include='src/dztgbot/infrastructure/persistence/workflow_sqlite.py,src/dztgbot/services/submission_service.py'

      - name: ShellCheck deployment scripts
        run: |
          shellcheck --version
          shellcheck scripts/deploy.sh
